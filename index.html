<body style="
    margin: 0;
    min-height: 100vh;
    background-image: url('https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTBsWxNR3-dmAwkyLS3DxCMa2_3QIVYQySzia7dmFYu5g&s=10');
    background-size: cover;
    background-repeat: no-repeat;
    background-position: center;
    background-attachment: fixed;
">

<h1 style="text-align:center; color:white;">
    tsubasasle
</h1>

<div id="game" style="text-align:center;">
</div>

<br>

<div style="text-align:center;">
    <button onclick="checkWord()">Guess</button>
</div>

<p id="a" style="
    text-align:center;
    color:white;
    font-size:30px;
"></p>

<script>

let guesses = 0;
let maxGuesses = 5;
let gameOver = false;
let game = document.getElementById("game");

addRow();

function addRow() {

    let row = document.createElement("div");

    row.style.marginBottom = "10px";

    for (let i = 0; i < 7; i++) {

        let box = document.createElement("input");

        box.maxLength = 1;
        box.style.width = "50px";
        box.style.height = "50px";
        box.style.fontSize = "40px";
        box.style.textAlign = "center";

        row.appendChild(box);
    }

    game.appendChild(row);
}

function checkWord() {

    if (gameOver) {
        return;
    }

    let answer = "trooper";

    let rows = game.children;
    let currentRow = rows[rows.length - 1];
    let boxes = currentRow.children;

    let guess = "";

    for (let i = 0; i < 7; i++) {
        guess += boxes[i].value.toLowerCase();
    }

    for (let i = 0; i < 7; i++) {

        if (guess[i] == answer[i]) {

            boxes[i].style.backgroundColor = "green";
            boxes[i].style.color = "white";

        } else if (answer.includes(guess[i])) {

            boxes[i].style.backgroundColor = "gold";
            boxes[i].style.color = "white";

        } else {

            boxes[i].style.backgroundColor = "gray";
            boxes[i].style.color = "white";
        }
    }

    guesses++;

    if (guess == answer) {

        document.getElementById("a").innerHTML =
            "YOU GOT THE TSUBASALE!";

        document.getElementById("a").style.color = "green";

        gameOver = true;

        return;
    }

    if (guesses >= maxGuesses) {

        document.getElementById("a").innerHTML =
            "The answer was Trooper.";

        document.getElementById("a").style.color = "black";

        gameOver = true;

        return;
    }

    addRow();
}

</script>

</body>
